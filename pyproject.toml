[tool.uv]
dev-dependencies = [
    "black>=25.11.0,<26.0.0",
    "ipdb>=0.13.13,<1.0.0",
]

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"

[project]
authors = [
    {name = "Naveen M K", email = "naveen521kk@gmail.com"},
]
requires-python = "<4.0,>=3.8"
dependencies = [
    "flask>=3.1.3,<4.0",
    "python-dotenv>=1.2.1,<2.0",
    "flask-cors>=6.0.2,<7.0",
    "certifi",
    "sqlalchemy>=1.4.54,<2.0.0",
    "Flask-SQLAlchemy>=3.1.1,<4.0.0",
    "cryptography>=46.0.7,<47.0.0",
    "psycopg2-binary>=2.9.11,<3.0.0",
]
name = "manim-website-api"
version = "0.1.0"
description = ""
readme = "README.md"

[dependency-groups]
dev = [
    "black>=25.11.0,<26.0.0",
    "ipdb>=0.13.13,<1.0.0",
]

[project.optional-dependencies]
updator = [
    "requests>=2.32.5,<3",
    "feedparser>=6.0.12,<7.0",
    "google-api-python-client>=2.194.0,<3.0",
]
